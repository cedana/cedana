name: Test

permissions:
  contents: write # to publish the test matrix image to the test-summary-assets branch
  packages: read
  id-token: write
  pull-requests: write
  checks: write
  actions: read # to list the jobs of the run when posting the summary

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch, tag, or SHA to run on"
        required: false
        default: ""
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false
      large:
        type: boolean
        description: "Run large tests"
        required: false
        default: false
      kubernetes:
        type: boolean
        description: "Run kubernetes tests"
        required: false
        default: true
      slurm:
        type: boolean
        description: "Run slurm tests"
        required: false
        default: true
      slurm_versions:
        type: string
        description: "SLURM versions to test, from download.yml's output (JSON array)"
        required: false
        default: ""
      parallelism:
        type: number
        description: "Parallelism for running tests"
        required: false
        default: 2
      runner:
        type: string
        description: "Runner machine for CPU tests"
        required: false
        default: 2cpu
      runner_gpu:
        type: string
        description: "Runner machine for GPU tests"
        required: false
        default: 4cpu-1gpu
      post_summary_slack:
        type: string
        description: "Webhook URL for posting summary to Slack"
        required: false
        default: ""

env:
  CEDANA_URL: ${{ vars.CEDANA_URL }}
  CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
  CEDANA_LOG_LEVEL: debug
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  FORMATTER: junit
  RETRIES: 0
  DEBUG: 0

jobs:
  unit:
    name: Unit
    runs-on: runs-on=${{github.run_id}}/runner=1cpu-${{ matrix.arch }}/extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    container:
      image: golang:1.25-bookworm
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - uses: runs-on/action@v1
      - uses: actions/checkout@v4
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          fetch-tags: true
          token: ${{ secrets.GIT_CI_PAT }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cedana-${{ matrix.arch }}

      - name: Download plugins
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: plugin-${{ matrix.arch }}*
          merge-multiple: true

      - name: Download streamer plugin # if provided from a caller workflow, will be later installed
        uses: actions/download-artifact@v4
        with:
          name: streamer-${{ matrix.arch }}

      - name: Make executable
        run: |
          chmod +x ./cedana
          chmod +x ./libcedana-*.so

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Run unit tests
        run: make test-unit

  script:
    name: Script
    runs-on: runs-on=${{github.run_id}}/runner=1cpu-${{ matrix.arch }}/extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        name:
          - install-deps
          - install-service
          - reset-service
          - configure-shm
        arch:
          - amd64
          - arm64
    steps:
      - uses: runs-on/action@v1
      - uses: actions/checkout@v4
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: cedana-${{ matrix.arch }}

      - name: Run k8s setup host
        env:
          CEDANA_PLUGINS_BUILDS: local # change to alpha to test plugin downloads
        run: |
          sudo chmod +x ./cedana
          sudo cp ./cedana /usr/local/bin/
          sudo \
            ENV="CI" \
            CEDANA_URL="${CEDANA_URL}" \
            CEDANA_AUTH_TOKEN="${CEDANA_AUTH_TOKEN}" \
            CEDANA_LOG_LEVEL="${CEDANA_LOG_LEVEL}" \
            CEDANA_PLUGINS_BUILDS="${CEDANA_PLUGINS_BUILDS}" \
            scripts/${{ matrix.name }}.sh

  basic:
    name: Basic
    runs-on: runs-on=${{github.run_id}}/runner=${{ inputs.runner }}-${{ matrix.arch }}/extras=s3-cache
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    container:
      image: cedana/cedana-test:latest
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
      options: --privileged --init --cgroupns=host
    steps:
      - uses: runs-on/action@v1
      - uses: actions/checkout@v4
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cedana-${{ matrix.arch }}

      - name: Download CRIU
        uses: actions/download-artifact@v4
        with:
          name: criu-${{ matrix.arch }}

      - name: Make executable
        run: |
          chmod +x ./cedana*
          chmod +x ./criu
          echo "$PWD" >> $GITHUB_PATH

      - name: Install
        run: |
          make install
          sudo -E cedana plugin install criu

      - name: Mark git dir as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Run regression tests
        env:
          LARGE: ${{ inputs.large }}
          PARALLELISM: ${{ env.DEBUG == '1' && 1 || inputs.parallelism }}
        run: |
          if [ "$LARGE" = "true" ]; then
            make test-regression TAGS=base PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
          else
            make test-regression TAGS=base,!large PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
          fi

      - name: Label report # with the job name, so the summary can link to it
        if: always()
        run: find /tmp -maxdepth 1 -name 'report*.xml' -exec sed -i 's|<testsuites |<testsuites name="Basic (${{ matrix.arch }})" |' {} +

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.arch }}
          path: /tmp/report*.xml

  plugin:
    name: Plugin
    runs-on: runs-on=${{github.run_id}}/runner=${{ inputs.runner }}-${{ matrix.arch }}/tag=${{ matrix.plugin }}/extras=s3-cache
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - runc
          - crun
          - containerd
          - storage/cedana
          - storage/s3
          - storage/gcs
          - storage/csx
        arch:
          - amd64
          - arm64
    container:
      image: cedana/cedana-test:latest
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
      options: --privileged --init --cgroupns=host
    steps:
      - uses: runs-on/action@v1
      - uses: actions/checkout@v4
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cedana-${{ matrix.arch }}

      - name: Download plugins
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: plugin-${{ matrix.arch }}*
          merge-multiple: true

      - name: Download CRIU
        uses: actions/download-artifact@v4
        with:
          name: criu-${{ matrix.arch }}

      - name: Download containerd runtime
        if: matrix.plugin == 'containerd'
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: containerd-runtime-${{ matrix.arch }}-*
          merge-multiple: true

      - name: Download CSX
        if: matrix.plugin == 'storage/csx'
        uses: actions/download-artifact@v4
        with:
          name: csx-${{ matrix.arch }}

      - name: Make executable
        run: |
          chmod +x ./cedana*
          chmod +x ./criu
          if [ "${{ matrix.plugin }}" = "storage/csx" ]; then
            chmod +x ./csx
          fi
          echo "$PWD" >> $GITHUB_PATH

      - name: Install
        run: |
          make install
          # Plugins below are used across multiple tests, so install them always
          sudo -E cedana plugin install criu storage/cedana storage/s3 storage/gcs
          sudo -E cedana plugin install ${{ matrix.plugin }}
          if [ "${{ matrix.plugin }}" = "containerd" ]; then
            sudo -E cedana plugin install runc crun containerd/runtime-runc
          fi
          if [ "${{ matrix.plugin }}" = "storage/csx" ]; then
            sudo -E cedana plugin install csx
          fi

      - name: Mark git dir as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Run regression tests
        env:
          LARGE: ${{ inputs.large }}
          PARALLELISM: ${{ inputs.parallelism }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          # replace slash in plugin with colon so that the tag is namespaced correctly
          # e.g. storage/cedana -> storage:cedana
          PLUGIN=$(echo $PLUGIN | sed 's/\//:/g')
          if [ "$LARGE" = "true" ]; then
            make test-regression TAGS=!gpu,!streamer,$PLUGIN PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
          else
            make test-regression TAGS=!gpu,!streamer,$PLUGIN,!large PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
          fi

      - name: Set plugin name
        if: always()
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          PLUGIN=$(echo $PLUGIN | sed 's/\//-/g')
          echo "PLUGIN=$PLUGIN" >> $GITHUB_ENV

      - name: Label report # with the job name, so the summary can link to it
        if: always()
        run: find /tmp -maxdepth 1 -name 'report*.xml' -exec sed -i 's|<testsuites |<testsuites name="Plugin (${{ matrix.plugin }}, ${{ matrix.arch }})" |' {} +

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.arch }}-${{ env.PLUGIN }}
          path: /tmp/report*.xml

  streamer:
    name: Streamer
    uses: ./.github/workflows/test_streamer.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      large: ${{ inputs.large }}
      parallelism: ${{ inputs.parallelism }}
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner_gpu }}
      post_summary: false # Will post consolidated summary instead

  gpu:
    name: GPU
    uses: ./.github/workflows/test_gpu.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      large: ${{ inputs.large }}
      parallelism: ${{ inputs.parallelism }}
      runner: ${{ inputs.runner_gpu }}
      post_summary: false # Will post consolidated summary instead

  # XXX: Below kubernetes tests are split into separate workflows, instead of using matrix,
  # because of Github Actions issue of using concurrency group together with matrix jobs
  # within the same workflow file.
  # https://github.com/orgs/community/discussions/26774

  k3s:
    name: Kubernetes
    uses: ./.github/workflows/test_k8s.yml
    if: ${{ inputs.kubernetes }}
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      platform: K3s
      large: false # K3s is only for small tests
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner_gpu }}
      parallelism: ${{ inputs.parallelism }}
      post_summary: false # Will post consolidated summary instead

  eks:
    name: Kubernetes
    uses: ./.github/workflows/test_k8s.yml
    if: ${{ inputs.kubernetes }}
    secrets: inherit
    concurrency: test-k8s-eks # Since the cluster is reused
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      platform: EKS
      runner: ${{ inputs.runner }}
      large: ${{ inputs.large }}
      runner_gpu: ${{ inputs.runner }} # No need for GPU runner
      parallelism: ${{ inputs.parallelism }}
      post_summary: false # Will post consolidated summary instead

  eks-karpenter:
    name: Kubernetes
    uses: ./.github/workflows/test_k8s.yml
    if: ${{ inputs.kubernetes }}
    secrets: inherit
    concurrency: test-k8s-karpenter # Since the cluster is reused
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      platform: EKS-Karpenter
      large: ${{ inputs.large }}
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner }} # No need for GPU runner
      parallelism: ${{ inputs.parallelism }}
      post_summary: false # Will post consolidated summary instead

  gke:
    name: Kubernetes
    uses: ./.github/workflows/test_k8s.yml
    if: ${{ inputs.kubernetes }}
    secrets: inherit
    concurrency: test-k8s-gke # Since the cluster is reused
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      platform: GKE
      large: ${{ inputs.large }}
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner }} # No need for GPU runner
      parallelism: ${{ inputs.parallelism }}
      post_summary: false # Will post consolidated summary instead

  nebius:
    name: Kubernetes
    uses: ./.github/workflows/test_k8s.yml
    if: ${{ inputs.kubernetes && inputs.large }} # Only run Nebius when large=true
    secrets: inherit
    concurrency: test-k8s-nebius # Since the cluster is reused
    with:
      ref: ${{ inputs.ref }}
      debug: ${{ inputs.debug }}
      platform: Nebius
      large: ${{ inputs.large }}
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner }} # No need for GPU runner
      parallelism: ${{ inputs.parallelism }}
      post_summary: false # Will post consolidated summary instead

  slurm:
    name: Slurm
    uses: ./.github/workflows/test_slurm.yml
    # Empty means download's slurm job was skipped, so there are no artifacts to test.
    if: ${{ inputs.slurm && inputs.slurm_versions != '' }}
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      slurm_versions: ${{ inputs.slurm_versions }}
      debug: ${{ inputs.debug }}
      large: ${{ inputs.large }}
      runner: ${{ inputs.runner }}
      runner_gpu: ${{ inputs.runner_gpu }}
      # Pinned to 1 because SLURM tests share a single cluster instance.
      # Running them in parallel can cause resource collisions and flaky tests.
      parallelism: 1
      post_summary: false # Will post consolidated summary instead

  post-summary:
    name: Post Summary
    if: always()
    needs: [unit, script, basic, plugin, streamer, gpu, k3s, eks, eks-karpenter, gke, nebius, slurm]
    runs-on: ubuntu-latest
    steps:
      - uses: runs-on/action@v1

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: report

      - name: Post summary
        uses: cedana/cedana-test-summary@feat/initial # TODO: pin to v1 once released
        with:
          reports: report/**/*.xml
          jobs-filter: '^Test / ' # jobs of this workflow, as named by the callers (pr.yml, nightly.yml, ...)
          image-branch: test-summary-assets
          matrix-sections: |
            Kubernetes=^Kubernetes
            SLURM=^Slurm
            Others
          matrix-split: |
            CPU
            CUDA=\b(CUDA|GPU)\b
          # XXX: Testing only, revert to the commented line below before merging
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_TEST_ONLY }}
          # slack-webhook-url: ${{ inputs.post_summary_slack == 'nightly' && secrets.SLACK_WEBHOOK_URL_TESTS_NIGHTLY || inputs.post_summary_slack != '' && secrets.SLACK_WEBHOOK_URL_TESTS || '' }}
          anthropic-api-key: ${{ inputs.post_summary_slack != '' && secrets.ANTHROPIC_API_KEY || '' }}
