name: Test

permissions:
  contents: read
  packages: read
  id-token: write
  pull-requests: write
  checks: write
  actions: read # to list the jobs of the run when posting the summary

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch, tag, or SHA to run on"
        required: false
        default: ""
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false
      platforms:
        type: string
        description: "JSON list of platforms to run tests on (K3s, EKS, GKE, Nebius, EKS-Karpenter). Cloud platforms share a cluster, so their jobs are serialized with a concurrency group."
        required: false
        default: '["K3s"]'
      propagator:
        type: boolean
        description: "Deploy the propagator from the propagator-digests-* artifacts into the cluster, instead of using CEDANA_URL"
        required: false
        default: false
      upgrade:
        type: boolean
        description: "Start one K3s job from the latest released chart, and run its suite after upgrading to this one"
        required: false
        default: false
      soak:
        type: boolean
        description: "Also run the soak tests (each checkpoint/restore many times, to catch 1-in-N failures)"
        required: false
        default: false
      large:
        type: boolean
        description: "Run large tests"
        required: false
        default: false
      runner:
        type: string
        description: "Runner machine for CPU tests"
        required: false
        default: 2cpu
      runner_gpu:
        type: string
        description: "Runner machine for GPU tests"
        required: false
        default: 4cpu-16g-1xT4
      parallelism:
        type: number
        description: "Parallelism for running tests"
        required: false
        default: 2
      post_summary:
        type: boolean
        description: "Post test summary"
        required: false
        default: false

env:
  CEDANA_URL: ${{ vars.CEDANA_URL }}
  CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CEDANA_LOG_LEVEL: debug
  CEDANA_PROFILING_ENABLED: true
  CEDANA_METRICS_ENABLED: true
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  GCLOUD_PROJECT_ID: ${{ vars.GCLOUD_PROJECT_ID }}
  GCLOUD_SERVICE_ACCOUNT_KEY: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}
  GCLOUD_REGION: ${{ vars.GCLOUD_REGION }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  NB_REGION: ${{ vars.NB_REGION }}
  NB_PROJECT_ID: ${{ secrets.NB_PROJECT_ID }}
  NB_PUBLIC_KEY_ID: ${{ secrets.NB_PUBLIC_KEY_ID }}
  NB_SA_ID: ${{ secrets.NB_SA_ID }}
  NB_SA_PRIVATE_KEY: ${{ secrets.NB_SA_PRIVATE_KEY }}
  NB_SA_PRIVATE_KEY_PATH: ${{ secrets.NB_SA_PRIVATE_KEY_PATH }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  EKS_KARPENTER_CLUSTER: ${{ vars.EKS_KARPENTER_CLUSTER }}
  # Contains the common tag used by all vpc subnets
  EKS_KARPENTER_SUBNET_SELECTOR: ${{ secrets.EKS_KARPENTER_SUBNET_SELECTOR }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  NB_CLUSTER_NAME: ${{ vars.NB_CLUSTER_NAME }}
  FORMATTER: junit
  RETRIES: 1 # some tests are still flaky
  DEBUG: 0

jobs:
  propagator-connectivity:
    name: Propagator Connectivity
    if: ${{ !inputs.propagator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Quick connectivity test
        run: |
          echo "Testing basic connectivity to Propagator API..."
          curl -I "$CEDANA_URL/user" -H "Authorization: Bearer $CEDANA_AUTH_TOKEN"
          echo "✓ Connectivity test completed"

  # The K8s jobs, one per line, of the platforms asked for. Each line is a job (a matrix of
  # dimensions would need excludes to stay this small, and couldn't be filtered by platform).
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: List jobs
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # k3s_containerd: which containerd k3s runs on, the suite's own at the default socket
          # (external), or k3s's bundled one at /run/k3s/containerd, as on a stock k3s install
          # (embedded). The K3s jobs run different k3s and containerd versions, so together they
          # cover what customers run (the defaults: k3s v1.34.2, and the test image's containerd).
          # Cloud platforms get one job each, as they're serialized on a shared cluster.
          jobs=$(grep -v '^#' <<'EOF'
          # containerd 1.7: config version 2 only
          {"platform": "K3s", "compute": "CPU", "cr": "default", "storage": "storage/local", "arch": "arm64", "k3s_containerd": "external", "containerd_version": "1.7.36", "versions": "k3s v1.34.2, containerd 1.7.36"}
          # Kubernetes 1.36
          {"platform": "K3s", "compute": "CPU", "cr": "default", "storage": "storage/local", "arch": "arm64", "k3s_containerd": "embedded", "k3s_version": "v1.36.5+k3s1", "versions": "k3s v1.36.5, containerd 2.3.4"}
          # containerd 2.4: config version 4
          {"platform": "K3s", "compute": "CPU", "cr": "streamer", "storage": "storage/local", "arch": "arm64", "k3s_containerd": "external", "containerd_version": "2.4.2", "versions": "k3s v1.34.2, containerd 2.4.2"}
          # GPU streamer is covered by the GPU suite's streamer jobs
          {"platform": "K3s", "compute": "CUDA", "cr": "default", "storage": "storage/local", "arch": "amd64", "k3s_containerd": "external", "versions": "k3s v1.34.2, containerd of the test image"}
          # a customer's GPU nodes
          {"platform": "K3s", "compute": "CUDA", "cr": "default", "storage": "storage/local", "arch": "amd64", "k3s_containerd": "embedded", "k3s_version": "v1.34.8+k3s1", "versions": "k3s v1.34.8, containerd 2.2.3"}
          {"platform": "EKS", "compute": "CPU", "cr": "default", "storage": "storage/s3", "arch": "arm64"}
          {"platform": "EKS-Karpenter", "compute": "CPU", "cr": "default", "storage": "storage/cedana", "arch": "amd64"}
          {"platform": "GKE", "compute": "CPU", "cr": "streamer", "storage": "storage/cedana", "arch": "amd64"}
          {"platform": "Nebius", "compute": "CUDA", "cr": "default", "storage": "storage/local", "arch": "amd64"}
          EOF
          )
          echo "matrix=$(jq -sc --argjson platforms "$PLATFORMS" \
            '{include: map(select(.platform as $p | $platforms | index($p)))}' <<<"$jobs")" >>"$GITHUB_OUTPUT"

  k8s:
    name: Kubernetes (${{ matrix.platform }}, ${{ matrix.compute }}, ${{ matrix.cr }}, ${{ matrix.storage }}, ${{ matrix.arch }}${{ matrix.k3s_containerd && format(', {0}', matrix.k3s_containerd) || '' }}${{ matrix.versions && format(', {0}', matrix.versions) || '' }})
    runs-on: ${{ format(
      'runs-on={0}/runner={1}-{2}{3}/tag={4}-{5}/extras=s3-cache{6}',
      github.run_id,
      (matrix.compute == 'CUDA' && matrix.platform == 'K3s') && inputs.runner_gpu || inputs.runner,
      matrix.arch,
      (matrix.compute == 'CUDA' && matrix.platform == 'K3s' && inputs.runner_gpu != inputs.runner) && '-cuda-12-4' || '',
      matrix.cr,
      matrix.storage,
      (inputs.propagator && matrix.platform == 'K3s') && '/volume=80gb' || ''
      ) }}
    timeout-minutes: 240
    needs: [matrix, propagator-connectivity]
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.propagator-connectivity.result != 'failure' }}
    concurrency:
      # Cloud platforms share a cluster per arch, so their jobs run one at a time (also across runs)
      # and wait in line instead of being cancelled. K3s jobs get a unique group each, so they still
      # run in parallel.
      group: ${{ matrix.platform == 'K3s' && format('test-k8s-k3s-{0}-{1}', github.run_id, strategy.job-index) || format('test-k8s-{0}-{1}', matrix.platform, matrix.arch) }}
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    container:
      image: ${{ matrix.compute == 'CUDA' && matrix.platform == 'K3s' && 'cedana/cedana-test:cuda' || 'cedana/cedana-test:latest' }}
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
      # K3s: the container state dirs are on the runner's disk, as overlayfs (the snapshotter
      # real nodes use) can't be on the container's overlay root
      options: >-
        --privileged --init --cgroupns=host
        ${{ matrix.compute == 'CUDA' && matrix.platform == 'K3s' && '--ipc=host --gpus all' || '' }}
        ${{ matrix.platform == 'K3s' && '-v /var/lib/cedana-ci/rancher:/var/lib/rancher -v /var/lib/cedana-ci/containerd:/var/lib/containerd' || '' }}
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@v5
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download helm chart
        uses: actions/download-artifact@v7
        with:
          name: helm-chart
          path: /tmp/helm-chart

      - name: Download helper digest
        uses: actions/download-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests

      - name: Download helper image name
        uses: actions/download-artifact@v7
        with:
          name: image-name
          path: /tmp/image-name

      - name: Download controller digest
        uses: actions/download-artifact@v7
        with:
          name: controller-digests-${{ matrix.arch }}
          path: /tmp/controller-digests

      - name: Download controller image name
        uses: actions/download-artifact@v7
        with:
          name: controller-image-name
          path: /tmp/controller-image-name

      - name: Download propagator digest
        if: inputs.propagator
        uses: actions/download-artifact@v7
        with:
          name: propagator-digests-${{ matrix.arch }}
          path: /tmp/propagator-digests

      - name: Download propagator image name
        if: inputs.propagator
        uses: actions/download-artifact@v7
        with:
          name: propagator-image-name
          path: /tmp/propagator-image-name

      - name: Download samples
        id: samples
        continue-on-error: true # without download.yml's samples (a caller that doesn't ask for them), the image's own
        uses: actions/download-artifact@v7
        with:
          name: samples-${{ matrix.arch }}
          path: /tmp/samples

      - name: Install samples
        if: steps.samples.outcome == 'success'
        run: rm -rf /cedana-samples && tar -xzf /tmp/samples/samples-*.tar.gz -C /

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: cedana-${{ matrix.arch }}

      - name: Download plugins
        uses: actions/download-artifact@v7
        with:
          path: .
          pattern: plugin-${{ matrix.arch }}*
          merge-multiple: true

      - name: Download CRIU
        uses: actions/download-artifact@v7
        with:
          name: criu-${{ matrix.arch }}

      - name: Download containerd runtime
        uses: actions/download-artifact@v7
        with:
          path: .
          pattern: containerd-runtime-${{ matrix.arch }}-*
          merge-multiple: true

      - name: Download GPU plugin
        if: ${{ matrix.compute == 'CUDA' }}
        uses: actions/download-artifact@v7
        with:
          name: gpu-${{ matrix.arch }}

      - name: Download streamer plugin
        if: ${{ matrix.cr == 'streamer' }}
        uses: actions/download-artifact@v7
        with:
          name: streamer-${{ matrix.arch }}

      - name: Pre-install plugins
        env:
          GPU: ${{ matrix.compute == 'CUDA' && 'true' || 'false' }}
          STREAMER: ${{ matrix.cr == 'streamer' && 'true' || 'false' }}
        if: matrix.platform == 'K3s' # k3s will use pre-installed plugins
        run: |
          chmod +x ./cedana*
          chmod +x ./criu
          echo "$PWD" >> $GITHUB_PATH
          make install
          sudo -E cedana plugin install \
            runc \
            crun \
            containerd \
            containerd/runtime-runc \
            criu \
            storage/cedana \
            storage/s3 \
            storage/gcs
          if [ "$GPU" = "true" ]; then
            sudo -E cedana plugin install gpu
          fi
          if [ "$STREAMER" = "true" ]; then
            sudo -E cedana plugin install streamer
          fi

      - name: Mark git dir as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Run k8s tests
        env:
          CEDANA_CHECKPOINT_DIR: ${{ matrix.storage == 'storage/local' && '/tmp' || (matrix.storage == 'storage/s3' && 's3://checkpoints-ci' || 'cedana://ci') }}
          CEDANA_CHECKPOINT_STREAMS: ${{ matrix.cr == 'streamer' && '4' || '0' }}
          CEDANA_PLUGINS_BUILDS: ${{ matrix.platform == 'K3s' && 'local' || 'alpha' }}
          PLATFORM: ${{ matrix.platform }}
          K3S_CONTAINERD: ${{ matrix.k3s_containerd || '' }}
          # From the matrix's include (empty: the defaults)
          K3S_VERSION: ${{ matrix.k3s_version || '' }}
          CONTAINERD_VERSION: ${{ matrix.containerd_version || '' }}
          # Soak tests run on K3s only: cloud clusters are shared
          SOAK: ${{ (inputs.soak && matrix.platform == 'K3s') && '1' || '0' }}
          # This job's suite then runs on an install upgraded from the latest release
          UPGRADE: ${{ (inputs.upgrade && matrix.platform == 'K3s' && matrix.compute == 'CPU' && matrix.cr == 'default' && matrix.k3s_containerd == 'external') && '1' || '0' }}
          GPU: ${{ matrix.compute == 'CUDA' && '1' || '0' }}
          STREAMER: ${{ matrix.cr == 'streamer' && 'true' || 'false' }}
          LARGE: ${{ (inputs.large && matrix.platform != 'K3s') && '1' || '0' }} # K3s is only for small tests
          PARALLELISM: ${{ (matrix.compute == 'CUDA' || env.DEBUG == '1') && 1 || inputs.parallelism }} # limit GPU tests to 1 parallelism to avoid GPU contention for now
          EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}-${{ matrix.arch }}
          GKE_CLUSTER_NAME: ${{ env.GKE_CLUSTER_NAME }}-${{ matrix.arch }}
          NB_CLUSTER_NAME: ${{ env.NB_CLUSTER_NAME }}-${{ matrix.arch }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          PROPAGATOR_BUCKET_NAME: ${{ vars.PROPAGATOR_BUCKET_NAME }}
          PROPAGATOR_PLUGINS_BUCKET: ${{ vars.PROPAGATOR_PLUGINS_BUCKET }}
        run: |
          if [ -d /tmp/propagator-digests ]; then
            PROPAGATOR_DIGEST=sha256:$(ls /tmp/propagator-digests | head -n 1)
            PROPAGATOR_REPO=$(cat /tmp/propagator-image-name/name.txt | head -n 1)
          fi
          HELPER_DIGEST=sha256:$(ls /tmp/digests | head -n 1)
          HELPER_REPO=$(cat /tmp/image-name/name.txt | head -n 1)
          CONTROLLER_DIGEST=sha256:$(ls /tmp/controller-digests | head -n 1)
          CONTROLLER_REPO=$(cat /tmp/controller-image-name/name.txt | head -n 1)
          HELM_CHART=/tmp/helm-chart

          export CEDANA_PLUGINS_CRIU_VERSION=$(cat ./criu-version.txt)
          export CEDANA_PLUGINS_CONTAINERD_RUNTIME_VERSION=$(cat ./containerd-runtime-version.txt)
          if [ "$GPU" = "1" ]; then
            export CEDANA_PLUGINS_GPU_VERSION=$(cat ./gpu-version.txt)
          fi
          if [ "$STREAMER" = "true" ]; then
            export CEDANA_PLUGINS_STREAMER_VERSION=$(cat ./streamer-version.txt)
          fi

          # Map platform names to provider names
          case "$PLATFORM" in
            K3s)  PROVIDER="k3s" ;;
            EKS)  PROVIDER="aws" ;;
            EKS-Karpenter) PROVIDER="eks-karpenter" ;;
            GKE)  PROVIDER="gcp" ;;
            Nebius) PROVIDER="nebius" ;;
            *)    PROVIDER="generic" ;;
          esac

          TAGS="k8s"
          if [ "$SOAK" != "1" ]; then
            TAGS="${TAGS},!soak"
          fi
          if [ "$GPU" = "1" ]; then
            TAGS="${TAGS},gpu"
          else
            TAGS="${TAGS},!gpu"
          fi
          if [ "$LARGE" = "0" ]; then
            TAGS="${TAGS},!samples,!large"
          fi
          if [ "$PLATFORM" = "EKS-Karpenter" ]; then
            TAGS="${TAGS},spot"
          else
            TAGS="${TAGS},!spot"
          fi
          # Nebius only runs large GPU workloads (skip small tests)
          if [ "$PROVIDER" = "nebius" ]; then
            TAGS="${TAGS},large"
          fi
          # Skip large cpu workload tests on gcp only
          if [ "$PROVIDER" = "gcp" ]; then
            TAGS="${TAGS},!large"
          fi

          run_suite() {
            make test-k8s "$@" \
              PROVIDER=$PROVIDER \
              K3S_CONTAINERD=$K3S_CONTAINERD \
              GPU=$GPU \
              FORMATTER=$FORMATTER \
              DEBUG=$DEBUG \
              CONTROLLER_REPO=$CONTROLLER_REPO \
              CONTROLLER_DIGEST=$CONTROLLER_DIGEST \
              HELPER_REPO=$HELPER_REPO \
              HELPER_DIGEST=$HELPER_DIGEST \
              PROPAGATOR_REPO=$PROPAGATOR_REPO \
              PROPAGATOR_DIGEST=$PROPAGATOR_DIGEST \
              HELM_CHART=$HELM_CHART
          }

          # The suite then starts from the latest released chart, and runs on it upgraded to
          # this one (see setup_suite.bash)
          if [ "$UPGRADE" = "1" ]; then
            export UPGRADE_FROM_CHART=latest
          else
            TAGS="${TAGS},!upgrade"
          fi

          run_suite TAGS=$TAGS PARALLELISM=$PARALLELISM RETRIES=$RETRIES

      - name: Label report # with the job name, so the summary can link to it
        if: always()
        run: find /tmp -maxdepth 1 -name 'report*.xml' -exec sed -i 's|<testsuites |<testsuites name="Kubernetes (${{ matrix.platform }}, ${{ matrix.compute }}, ${{ matrix.cr }}, ${{ matrix.storage }}, ${{ matrix.arch }}${{ matrix.k3s_containerd && format(', {0}', matrix.k3s_containerd) || '' }}${{ matrix.versions && format(', {0}', matrix.versions) || '' }})" |' {} +

      - name: Set sanitized storage
        if: always()
        env:
          STORAGE: ${{ matrix.storage }}
        run: |
          STORAGE=$(echo $STORAGE | sed 's/\//-/g')
          echo "STORAGE=$STORAGE" >> $GITHUB_ENV

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.arch }}-k8s-${{ matrix.platform }}-${{ matrix.cr }}-${{ env.STORAGE }}-${{ matrix.compute }}${{ matrix.k3s_containerd && format('-{0}', matrix.k3s_containerd) || '' }}
          path: | # with the suite's warnings (see report_warning), shown in the summary
            /tmp/report*.xml
            /tmp/warnings.jsonl

      - name: Upload propagator logs
        if: always() && inputs.propagator
        uses: actions/upload-artifact@v6
        with:
          name: propagator-logs-${{ matrix.arch }}-k8s-${{ matrix.platform }}-${{ matrix.cr }}-${{ env.STORAGE }}-${{ matrix.compute }}${{ matrix.k3s_containerd && format('-{0}', matrix.k3s_containerd) || '' }}
          path: |
            /tmp/propagator*.log
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: k8s-diagnostics-${{ matrix.arch }}-k8s-${{ matrix.platform }}-${{ matrix.cr }}-${{ env.STORAGE }}-${{ matrix.compute }}${{ matrix.k3s_containerd && format('-{0}', matrix.k3s_containerd) || '' }}
          path: /tmp/k8s-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  post-summary:
    name: Post Summary
    if: inputs.post_summary && always()
    needs: k8s
    runs-on: ubuntu-24.04
    steps:
      - name: Download reports
        uses: actions/download-artifact@v7
        with:
          pattern: test-report-*-k8s-*
          path: report

      - name: Post summary
        uses: cedana/cedana-test-summary@v1
        with:
          reports: report/**/*.xml
          title: Kubernetes
          jobs-filter: '(^|/ )(Kubernetes \(|Propagator Connectivity)'
          image-branch: test-summary-assets
          image-repository: cedana/summaries # public, so the image renders when called from private repos
          image-token: ${{ secrets.GIT_CI_PAT }}
          matrix-sections: |
            K3s=^Kubernetes \(K3s,
            EKS=^Kubernetes \(EKS,
            EKS-Karpenter=^Kubernetes \(EKS-Karpenter,
            GKE=^Kubernetes \(GKE,
            Nebius=^Kubernetes \(Nebius,
          matrix-split: |
            CPU
            CUDA=\b(CUDA|GPU)\b
