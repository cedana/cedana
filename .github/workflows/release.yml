name: Release

# Tags only publish to the alpha channel (propagator cedana-alpha, cedana/cedana-helper-test image) at
# version = tag. cedana-marshal's release suite tests these exact artifacts, and its release-publish
# promotes them to the release channel, moves latest and creates the GitHub release.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_build:
        type: boolean
        description: "Run build with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: ${{ github.repository }}-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_build }}
      cedana: true
      plugins: true
      image: true
      image_name: cedana/cedana-helper-test

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: build
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      propagator: true
      propagator_repo: cedana-alpha
      dockerhub: true
      post_summary: false
