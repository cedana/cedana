name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_build:
        type: boolean
        description: "Run build with debugging enabled"
        required: false
        default: false
      debug_test:
        type: boolean
        description: "Run tests with debugging enabled"
        required: false
        default: false
      debug_bench:
        type: boolean
        description: "Run benchmark with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: ${{ github.repository }}-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release workflow trumps the push workflow: cancel any push run for this
  # commit so that only the release runs.
  cancel_push:
    name: Cancel push
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel push runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow push.yml --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
            xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY"

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_build }}
      cedana: true
      plugins: true
      image: true

  download:
    name: Download
    uses: ./.github/workflows/download.yml
    secrets: inherit
    with:
      criu_version: criu-dev
      gpu_version: experiment/streamer-memfd
      streamer_version: experiment/streamer-memfds
      helm_chart_version: main
      controller_version: main
      containerd_runtime_version: cedana
      slurm_version: main
      csx_version: main
      propagator_version: main

  # Publish to the alpha channel first so that tests (e.g. EKS/GKE) can download
  # this build from the propagator. The actual release publish happens after
  # tests pass.
  prepublish:
    name: Pre-publish
    uses: ./.github/workflows/publish.yml
    needs: build
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      propagator: true
      propagator_repo: cedana-alpha
      dockerhub: true
      post_summary: false

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    needs: [prepublish, download]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_test }}
      slurm_versions: ${{ needs.download.outputs.slurm_versions }}
      propagator: true

  bench:
    name: Bench
    uses: ./.github/workflows/bench.yml
    needs: [prepublish, download]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_bench }}
      samples: 2
      post_summary_pr: false
      post_summary_slack: default
      comparison_previous: true
      comparison_runtime: true
      push_results: true
      results_dataset: cedana

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: [test, bench]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      github: true
      propagator: true
      propagator_repo: cedana
      dockerhub: true
      dockerhub_latest: true
      post_summary: true
