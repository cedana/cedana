name: Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_build:
        type: boolean
        description: "Run build with debugging enabled"
        required: false
        default: false
      debug_test:
        type: boolean
        description: "Run tests with debugging enabled"
        required: false
        default: false
      debug_bench:
        type: boolean
        description: "Run benchmark with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: ${{ github.repository }}-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tagged commit is a release: the release workflow runs instead of this one.
  check_release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
    steps:
      - name: Check if commit is tagged
        id: tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" | grep -q "^$GITHUB_SHA"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check_release
    if: needs.check_release.outputs.release != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_build }}
      cedana: true
      plugins: true
      image: true
      image_name: cedana/cedana-helper-test

  download:
    name: Download
    needs: check_release
    if: needs.check_release.outputs.release != 'true'
    uses: ./.github/workflows/download.yml
    secrets: inherit
    with:
      criu_version: criu-dev
      gpu_version: main
      streamer_version: main
      helm_chart_version: main
      controller_version: main
      containerd_runtime_version: cedana
      slurm_version: main
      csx_version: main
      propagator_version: main

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: build
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      propagator: true
      propagator_repo: cedana-alpha
      dockerhub: true
      post_summary: false

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    needs: [publish, download]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_test }}
      slurm_versions: ${{ needs.download.outputs.slurm_versions }}
      propagator: true

  bench:
    name: Bench
    uses: ./.github/workflows/bench.yml
    needs: [publish, download]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_bench }}
      samples: 2
      push_results: true
      results_dataset: cedana_alpha
      post_summary_pr: false
