name: Test Image

# The test images the test jobs run in: cedana/cedana-test:latest (test/Dockerfile) and :cuda
# (test/cuda.Dockerfile). Each is also tagged by its Dockerfile's content, wip-<hash> and
# cuda-wip-<hash> (the hash is the Dockerfile's git blob; the Dockerfiles copy nothing from their
# context, so the Dockerfile is all of the image but its base images), and built only where that
# tag is missing.
#
# At a ref whose Dockerfile is main's, the tests use latest/cuda, which this keeps at main's
# Dockerfile: a merge retags the image its PR built rather than building it again. Where the
# Dockerfile differs from main's (a PR that changes it), they use its hash tag, so a PR is tested
# with its own image and every other run keeps main's. The moving tags are written by one Tag job at
# a time across all runs, which checks main's Dockerfile again first, so a run that started at an
# older main can't roll them back.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch, tag, or SHA to run on"
        required: false
        default: ""
      image_name:
        type: string
        description: "Name of the test Docker image"
        required: false
        default: "cedana/cedana-test"
    outputs:
      image:
        description: "The test image for the ref (latest, or its Dockerfile's hash tag)"
        value: ${{ jobs.resolve.outputs.image }}
      image_cuda:
        description: "The CUDA test image for the ref (cuda, or its Dockerfile's hash tag)"
        value: ${{ jobs.resolve.outputs.image_cuda }}

jobs:
  resolve:
    name: Resolve
    runs-on: runs-on=${{github.run_id}}/pool=1cpu-amd64
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ steps.resolve.outputs.image }}
      image_cuda: ${{ steps.resolve.outputs.image_cuda }}
      images: ${{ steps.resolve.outputs.images }}
      builds: ${{ steps.resolve.outputs.builds }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: runs-on/action@v2

      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIT_CI_PAT }}
          sparse-checkout: test

      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # images: per image, its Dockerfile's blob, its hash tag, whether to build it, and the moving
      # tag to keep at it (at main's Dockerfile); tag: whether the Tag job has anything to do
      - name: Resolve images
        id: resolve
        env:
          IMAGE: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin main
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest; }

          images='[]' tag=false
          for name in latest cuda; do
            file=test/Dockerfile prefix=
            if [ "$name" = cuda ]; then file=test/cuda.Dockerfile prefix=cuda-; fi
            blob=$(git rev-parse "HEAD:$file")
            wip="$IMAGE:${prefix}wip-${blob:0:12}"
            have=$(digest "$wip" || true)
            build=false moving=
            if [ -z "$have" ]; then build=true tag=true; fi

            if [ "$blob" = "$(git rev-parse "FETCH_HEAD:$file")" ]; then
              moving="$IMAGE:$name" # main's Dockerfile: the moving tag, kept at it
              use="$moving"
              if [ "$build" = true ] || [ "$(digest "$moving" || true)" != "$have" ]; then tag=true; fi
            else
              use="$wip"
            fi

            images=$(jq -c --arg name "$name" --arg file "$file" --arg blob "$blob" --arg wip "$wip" \
              --argjson build "$build" --arg moving "$moving" \
              '. + [{name: $name, file: $file, blob: $blob, wip: $wip, build: $build, moving: $moving}]' <<<"$images")
            echo "$use: $wip$( [ "$build" = true ] && echo ", building $file" )" >> "$GITHUB_STEP_SUMMARY"
            echo "$( [ "$name" = cuda ] && echo image_cuda || echo image )=$use" >> "$GITHUB_OUTPUT"
          done
          {
            echo "sha=$(git rev-parse HEAD)" # what the builds check out: the ref may move on meanwhile
            echo "images=$images"
            echo "builds=$(jq -c 'map(select(.build) | {name, file})' <<<"$images")"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.image.name }}, ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.builds != '[]'
    # sticky: BuildKit's state lives on a sticky disk per image and arch, so a Dockerfile change
    # rebuilds only the layers from the change on
    runs-on: runs-on=${{github.run_id}}/runner=4cpu-${{ matrix.arch }}/sticky=buildkit-test-${{ matrix.image.name }}-${{ matrix.arch }}:60gb
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.builds) }}
        arch:
          - amd64
          - arm64
    steps:
      - id: runs-on
        uses: runs-on/action@v2
        with:
          sticky_cache: buildkit

      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ needs.resolve.outputs.sha }} # the commit resolve hashed
          token: ${{ secrets.GIT_CI_PAT }}
          sparse-checkout: test

      # The builder RunsOn's buildkit sticky cache expects (see runs-on/action)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ steps.runs-on.outputs.buildkit-builder }}
          version: v0.34.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.31.1
          cleanup: false

      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.runs-on.outputs.buildkit-builder }}
          context: ./test
          file: ./${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: |
            type=image,name=${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=s3,blobs_prefix=cache/${{ github.repository }}/,manifests_prefix=cache/${{ github.repository }}/test-${{ matrix.image.name }}-${{ matrix.arch }},region=${{ env.RUNS_ON_AWS_REGION }},bucket=${{ env.RUNS_ON_S3_BUCKET_CACHE }}
          cache-to: type=s3,blobs_prefix=cache/${{ github.repository }}/,manifests_prefix=cache/${{ github.repository }}/test-${{ matrix.image.name }}-${{ matrix.arch }},region=${{ env.RUNS_ON_AWS_REGION }},bucket=${{ env.RUNS_ON_S3_BUCKET_CACHE }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: test-image-digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  # The hash tags of what was built, and the moving tags, one job at a time across all runs (queued,
  # none cancelled): a moving tag is only written while main's Dockerfile is still the one it's for.
  tag:
    name: Tag
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.tag == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: runs-on=${{github.run_id}}/pool=1cpu-amd64
    timeout-minutes: 30
    concurrency:
      group: cedana-test-image-tags
      cancel-in-progress: false
      queue: max
    steps:
      - uses: runs-on/action@v2

      - name: Download digests
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: test-image-digests-*

      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag
        env:
          IMAGE: ${{ inputs.image_name }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          GH_TOKEN: ${{ secrets.GIT_CI_PAT }}
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest; }
          jq -c '.[]' <<<"$IMAGES" | while read -r i; do
            name=$(jq -r .name <<<"$i") file=$(jq -r .file <<<"$i") blob=$(jq -r .blob <<<"$i")
            wip=$(jq -r .wip <<<"$i") moving=$(jq -r .moving <<<"$i")

            if [ "$(jq -r .build <<<"$i")" = true ]; then
              docker buildx imagetools create -t "$wip" \
                $(for d in /tmp/digests/test-image-digests-"$name"-*/*; do echo "$IMAGE@sha256:$(basename "$d")"; done)
              echo "$wip: built" >> "$GITHUB_STEP_SUMMARY"
            fi

            [ -n "$moving" ] || continue
            if [ "$(gh api "repos/cedana/cedana/contents/$file?ref=main" --jq .sha)" != "$blob" ]; then
              echo "$moving: left alone, main's $file has changed since" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$(digest "$moving" || true)" != "$(digest "$wip")" ]; then
              docker buildx imagetools create -t "$moving" "$wip"
              echo "$moving: now $wip" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
