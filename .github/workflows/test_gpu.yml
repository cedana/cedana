name: Test

permissions:
  contents: read
  packages: read
  id-token: write
  pull-requests: write
  checks: write
  actions: read # to list the jobs of the run when posting the summary

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch, tag, or SHA to run on"
        required: false
        default: ""
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false
      large:
        type: boolean
        description: "Run large tests"
        required: false
        default: false
      parallelism:
        type: number
        description: "Parallelism for running tests"
        required: false
        default: 2
      runner:
        type: string
        description: "Runner machine for tests"
        required: false
        default: 4cpu-1gpu
      post_summary:
        type: boolean
        description: "Post test summary"
        required: false
        default: false

env:
  CEDANA_URL: ${{ vars.CEDANA_URL }}
  CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
  CEDANA_LOG_LEVEL: debug
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  FORMATTER: junit
  RETRIES: 1 # some tests are still flaky
  DEBUG: 0

jobs:
  cuda:
    name: CUDA
    runs-on: runs-on=${{github.run_id}}/runner=${{  inputs.runner }}-${{ matrix.arch }}-cuda-${{ matrix.cuda_version }}/tag=${{ matrix.cr }}/extras=s3-cache
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cuda_version:
          # - 12-2
          # - 12-4
          - 12-8
          - 13-2
        cr:
          - default
          - streamer
        arch:
          - amd64
          - arm64
        exclude: # to reduce CI minutes
          - cuda_version: 12-2
            cr: streamer
          - cuda_version: 12-2
            cr: default
            arch: arm64
          - cuda_version: 12-4
            cr: default
          - cuda_version: 12-4
            cr: streamer
            arch: amd64
          - cuda_version: 12-8
            cr: streamer
          - cuda_version: 12-8
            cr: default
            arch: arm64
          - cuda_version: 13-2
            cr: default
            arch: arm64
          - cuda_version: 13-2
            cr: streamer
            arch: amd64
    container:
      image: cedana/cedana-test:cuda
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
      options: --privileged --init --ipc=host --device nvidia.com/gpu=all --cgroupns=host
    steps:
      - uses: runs-on/action@v1
      - uses: actions/checkout@v4
        with:
          repository: cedana/cedana # required for workflows reusing this workflow
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cedana-${{ matrix.arch }}

      - name: Download plugins
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: plugin-${{ matrix.arch }}*
          merge-multiple: true

      - name: Download streamer plugin # if provided from a caller workflow, will be later installed
        if: ${{ matrix.cr == 'streamer' }}
        uses: actions/download-artifact@v4
        with:
          name: streamer-${{ matrix.arch }}

      - name: Download GPU plugin # if provided from a caller workflow, will be later installed
        uses: actions/download-artifact@v4
        with:
          name: gpu-${{ matrix.arch }}

      - name: Download containerd runtime
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: containerd-runtime-${{ matrix.arch }}-*
          merge-multiple: true

      - name: Download CRIU
        uses: actions/download-artifact@v4
        with:
          name: criu-${{ matrix.arch }}

      - name: Download CSX
        uses: actions/download-artifact@v4
        with:
          name: csx-${{ matrix.arch }}

      - name: Make executable
        run: |
          chmod +x ./cedana*
          chmod +x ./criu
          chmod +x ./csx
          echo "$PWD" >> $GITHUB_PATH

      - name: Install
        env:
          STREAMER: ${{ matrix.cr == 'streamer' && 'true' || 'false' }}
        run: |
          make install
          # Plugins below are used across multiple tests, so install them always
          sudo -E cedana plugin install criu runc crun containerd containerd/runtime-runc
          sudo -E cedana plugin install storage/cedana storage/s3 storage/gcs storage/csx csx
          sudo -E cedana plugin install gpu # automatically installs the downloaded binary if available instead
          if [ "$STREAMER" = "true" ]; then
            sudo -E cedana plugin install streamer # automatically installs the downloaded binary if available instead
          fi

      - name: Mark git dir as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Run regression tests
        env:
          STREAMER: ${{ matrix.cr == 'streamer' && 'true' || 'false' }}
          LARGE: ${{ inputs.large }}
          PARALLELISM: ${{ env.DEBUG == '1' && 1 || inputs.parallelism }}
        run: |
          if [ "$STREAMER" = "true" ]; then
            if [ "$LARGE" = "true" ]; then
              make test-regression TAGS=gpu,streamer PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
            else
              make test-regression TAGS=gpu,streamer,!large PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
            fi
          else
            if [ "$LARGE" = "true" ]; then
              make test-regression TAGS=gpu,!streamer PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
            else
              make test-regression TAGS=gpu,!streamer,!large PARALLELISM=$PARALLELISM RETRIES=$RETRIES DEBUG=$DEBUG FORMATTER=$FORMATTER
            fi
          fi

      - name: Run cuda-samples interception check
        # Samples are CUDA 12.8-built. Run on the 12.8 runner, and on the 13.2
        # runner for backward-compat (12.8 binaries under a newer driver).
        # Missing samples auto-skip, so the same curated list is safe on both.
        if: ${{ !cancelled() && (matrix.cuda_version == '12-8' || matrix.cuda_version == '13-2') && matrix.cr == 'default' && matrix.arch == 'amd64' }}
        run: |
          mkdir -p /tmp/cuda-samples
          bats --filter-tags cuda-samples -r test/regression \
            --output /tmp/cuda-samples --report-formatter junit

      - name: Label reports # with the job name, so the summary can link to it
        if: always()
        run: |
          find /tmp -maxdepth 1 -name 'report*.xml' -exec sed -i 's|<testsuites |<testsuites name="CUDA (${{ matrix.cuda_version }}, ${{ matrix.cr }}, ${{ matrix.arch }})" |' {} +
          if [ -d /tmp/cuda-samples ]; then
            find /tmp/cuda-samples -name 'report.xml' -exec sed -i 's|<testsuites |<testsuites name="CUDA samples (intercepted, ${{ matrix.cuda_version }})" |' {} +
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.arch }}-cuda-${{ matrix.cuda_version }}-${{ matrix.cr }}
          path: |
            /tmp/report*.xml
            /tmp/cuda-samples/report.xml

  post-summary:
    name: Post Summary
    if: inputs.post_summary && always()
    needs: cuda
    runs-on: ubuntu-latest
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*-cuda-*
          path: report

      - name: Post summary
        uses: cedana/cedana-test-summary@v1
        with:
          reports: report/**/*.xml
          title: CUDA
          jobs-filter: '(^|/ )CUDA \('
          image-branch: test-summary-assets
          image-repository: cedana/summaries # public, so the image renders when called from private repos
          image-token: ${{ secrets.GIT_CI_PAT }}
