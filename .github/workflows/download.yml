name: Download

# This workload downloads external dependencies (binaries)  and uploads them as artifacts,
# that can be used in other workflows.

permissions:
  contents: write

env:
  CEDANA_URL: ${{ vars.CEDANA_URL }}
  CHANNEL: ${{ inputs.channel }}

on:
  workflow_call:
    inputs:
      channel:
        type: string
        description: >-
          Channel to download binaries and images from: "auto" (versions starting with "v" and "release"
          from the release channel, anything else from alpha), "alpha" (alpha, falling back to the release
          channel for versions that aren't in alpha, e.g. tags released before alpha-at-tag) or "release".
          A version of "release" is the latest release in every channel
        required: false
        default: "auto"
      cedana_version:
        type: string
        description: Version for Cedana binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      criu_version:
        type: string
        description: Version for CRIU binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      gpu_version:
        type: string
        description: Version for GPU binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      streamer_version:
        type: string
        description: Version for streamer binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      controller_version:
        type: string
        description: Version for controller binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      containerd_runtime_version:
        type: string
        description: Version for containerd runtime binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      oci_runtime_version:
        type: string
        description: Version for OCI runtime binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      helm_chart_version:
        type: string
        description: Version for Cedana Helm chart (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      slurm_version:
        type: string
        description: Version for cedana-slurm binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      slurm_ref:
        type: string
        description: Ref of cedana-slurm to check out (scripts, slurm-versions), if different from slurm_version (e.g. a PR head tested with binaries published at a release version)
        required: false
        default: ""
      csx_version:
        type: string
        description: Version for csx binaries (branch name, tag or "release" for latest release)
        required: false
        default: "none"
      propagator_version:
        type: string
        description: Version for propagator image (branch name, tag or "release" for latest release)
        required: false
        default: "none"
    outputs:
      slurm_versions:
        description: "SLURM versions, from cedana-slurm's slurm-versions file (JSON array)"
        value: ${{ jobs.slurm-versions.outputs.versions }}

jobs:
  cedana:
    name: Cedana
    if: ${{ inputs.cedana_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download cedana
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.cedana_version == 'release' && 'latest' || inputs.cedana_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac

          mkdir -p cedana
          cd cedana

          ARCH="${{ matrix.arch }}"
          FILE="cedana"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "$FILE"

          test -f "$FILE"
          test -s "$FILE"
          echo "${VERSION}" > cedana-version.txt

      - name: Upload cedana
        uses: actions/upload-artifact@v6
        with:
          name: cedana-${{ matrix.arch }}
          path: ./cedana/*

      - name: Get digest
        env:
          IMAGE_NAMES: ${{ (inputs.channel == 'alpha' && inputs.cedana_version != 'release' && 'cedana/cedana-helper-test cedana/cedana-helper') || ((inputs.channel == 'release' || inputs.cedana_version == 'release' || startsWith(inputs.cedana_version, 'v')) && 'cedana/cedana-helper') || 'cedana/cedana-helper-test' }}
          TAG: ${{ inputs.cedana_version == 'release' && 'latest' || inputs.cedana_version }}
        run: |
          mkdir -p /tmp/digests
          mkdir -p /tmp/image-name
          TAG=$(echo $TAG | sed 's/\//-/g')
          # The first image that has the tag, so alpha falls back to the release image
          IMAGE_NAME=""
          for NAME in $IMAGE_NAMES; do
            if docker pull --platform=linux/${{ matrix.arch }} $NAME:$TAG; then
              IMAGE_NAME=$NAME
              break
            fi
          done
          test -n "$IMAGE_NAME" || { echo "No image found for tag $TAG in: $IMAGE_NAMES"; exit 1; }
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:$TAG | cut -d'@' -f2)
          touch "/tmp/digests/${digest#sha256:}"
          echo "$IMAGE_NAME" > /tmp/image-name/name.txt

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

      - name: Upload image name
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@v6
        with:
          name: image-name
          path: /tmp/image-name/*
          if-no-files-found: error

  plugin:
    name: Plugin
    if: ${{ inputs.cedana_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        plugin:
          - runc
          - crun
          - containerd
          - podman
          - crio
          - kata
          - cloud-hypervisor
          - k8s
          - slurm
          - storage/cedana
          - storage/s3
          - storage/gcs
          - storage/csx
        arch:
          - amd64
          - arm64
    steps:
      - name: Set plugin name
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          PLUGIN=$(echo $PLUGIN | sed 's/\//-/g')
          echo "PLUGIN=$PLUGIN" >> $GITHUB_ENV

      - name: Download plugin
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.cedana_version == 'release' && 'latest' || inputs.cedana_version }}
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          ARCH="${{ matrix.arch }}"
          FILE="libcedana-${PLUGIN}.so"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "$FILE"

          test -f "$FILE"
          test -s "$FILE"
          echo "${VERSION}" > plugin-version.txt

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: plugin-${{ matrix.arch }}-${{ env.PLUGIN }}
          path: |
            ./libcedana-*.so
            ./plugin-version.txt

  criu:
    name: CRIU
    if: ${{ inputs.criu_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download CRIU
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.criu_version == 'release' && 'latest' || inputs.criu_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p criu
          ARCH="${{ matrix.arch }}"
          FILE="criu"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "criu/${FILE}"

          test -f "criu/${FILE}"
          test -s "criu/${FILE}"
          echo "${VERSION}" > criu/criu-version.txt

      - name: Upload CRIU
        uses: actions/upload-artifact@v6
        with:
          name: criu-${{ matrix.arch }}
          path: ./criu/*

  gpu:
    name: GPU
    if: ${{ inputs.gpu_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download GPU binaries
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.gpu_version == 'release' && 'latest' || inputs.gpu_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p gpu

          ARCH="${{ matrix.arch }}"
          BINARIES=(
            "cedana-gpu-controller"
            "libcedana-gpu.so"
            "libcedana-gpu-tracer.so"
          )
          for FILE in "${BINARIES[@]}"; do
            # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
              "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
              -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
              --output "gpu/${FILE}"
            test -f "gpu/${FILE}"
            test -s "gpu/${FILE}"
          done
          echo "${VERSION}" > gpu/gpu-version.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gpu-${{ matrix.arch }}
          path: ./gpu/*

  streamer:
    name: Streamer
    if: ${{ inputs.streamer_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download streamer
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.streamer_version == 'release' && 'latest' || inputs.streamer_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p streamer

          ARCH="${{ matrix.arch }}"
          FILE="cedana-image-streamer"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "streamer/${FILE}"

          test -f "streamer/${FILE}"
          test -s "streamer/${FILE}"
          echo "${VERSION}" > streamer/streamer-version.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: streamer-${{ matrix.arch }}
          path: ./streamer/*

  controller:
    name: Controller
    if: ${{ inputs.controller_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get digest
        env:
          IMAGE_NAMES: ${{ (inputs.channel == 'alpha' && inputs.controller_version != 'release' && 'cedana/cedana-controller-test cedana/cedana-controller') || ((inputs.channel == 'release' || inputs.controller_version == 'release' || startsWith(inputs.controller_version, 'v')) && 'cedana/cedana-controller') || 'cedana/cedana-controller-test' }}
          TAG: ${{ inputs.controller_version == 'release' && 'latest' || inputs.controller_version }}
        run: |
          mkdir -p /tmp/digests
          mkdir -p /tmp/image-name
          TAG=$(echo $TAG | sed 's/\//-/g')
          # The first image that has the tag, so alpha falls back to the release image
          IMAGE_NAME=""
          for NAME in $IMAGE_NAMES; do
            if docker pull --platform=linux/${{ matrix.arch }} $NAME:$TAG; then
              IMAGE_NAME=$NAME
              break
            fi
          done
          test -n "$IMAGE_NAME" || { echo "No image found for tag $TAG in: $IMAGE_NAMES"; exit 1; }
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:$TAG | cut -d'@' -f2)
          touch "/tmp/digests/${digest#sha256:}"
          echo "$IMAGE_NAME" > /tmp/image-name/name.txt

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: controller-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

      - name: Upload image name
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@v6
        with:
          name: controller-image-name
          path: /tmp/image-name/*
          if-no-files-found: error

  # Artifact names match cedana-propagator's build workflow, so its CI can
  # reuse test workflows with a freshly built image without this job.
  propagator:
    name: Propagator
    if: ${{ inputs.propagator_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get digest
        env:
          GH_TOKEN: ${{ secrets.GIT_CI_PAT }}
          VERSION: ${{ inputs.propagator_version }}
        run: |
          set -euo pipefail
          # Releases are only tagged by version, so resolve "release" to the latest one
          if [ "$VERSION" = "release" ]; then
            IMAGE_NAMES=cedana/cedana-propagator
            TAG=$(gh release view --repo cedana/cedana-propagator --json tagName --jq .tagName)
          elif [ "${VERSION#v}" != "$VERSION" ]; then
            IMAGE_NAMES=cedana/cedana-propagator
            TAG=$VERSION
          else
            IMAGE_NAMES=cedana/cedana-propagator-test
            TAG=$VERSION
          fi
          if [ "$VERSION" != "release" ]; then
            case "$CHANNEL" in
              alpha) IMAGE_NAMES="cedana/cedana-propagator-test cedana/cedana-propagator" ;;
              release) IMAGE_NAMES=cedana/cedana-propagator ;;
            esac
          fi
          mkdir -p /tmp/digests
          mkdir -p /tmp/image-name
          TAG=$(echo $TAG | sed 's/\//-/g')
          # The first image that has the tag, so alpha falls back to the release image
          IMAGE_NAME=""
          for NAME in $IMAGE_NAMES; do
            if docker pull --platform=linux/${{ matrix.arch }} $NAME:$TAG; then
              IMAGE_NAME=$NAME
              break
            fi
          done
          test -n "$IMAGE_NAME" || { echo "No image found for tag $TAG in: $IMAGE_NAMES"; exit 1; }
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:$TAG | cut -d'@' -f2)
          touch "/tmp/digests/${digest#sha256:}"
          echo "$IMAGE_NAME" > /tmp/image-name/name.txt

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: propagator-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

      - name: Upload image name
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@v6
        with:
          name: propagator-image-name
          path: /tmp/image-name/*
          if-no-files-found: error

  containerd-runtime-runc:
    name: Containerd Runtime
    if: ${{ inputs.containerd_runtime_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download runtime
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.containerd_runtime_version == 'release' && 'latest' || inputs.containerd_runtime_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p containerd-runtime-runc

          ARCH="${{ matrix.arch }}"
          FILE="cedana-shim-runc-v2"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "containerd-runtime-runc/${FILE}"

          test -f "containerd-runtime-runc/${FILE}"
          test -s "containerd-runtime-runc/${FILE}"
          echo "${VERSION}" > containerd-runtime-runc/containerd-runtime-version.txt

      - name: Upload runtime runc artifacts
        uses: actions/upload-artifact@v6
        with:
          name: containerd-runtime-${{ matrix.arch }}-runc
          path: ./containerd-runtime-runc/*

  oci-runtime:
    name: OCI Runtime
    if: ${{ inputs.oci_runtime_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download runtime
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.oci_runtime_version == 'release' && 'latest' || inputs.oci_runtime_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p oci-runtime

          ARCH="${{ matrix.arch }}"
          FILE="cedana-oci-runtime"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "oci-runtime/${FILE}"

          test -f "oci-runtime/${FILE}"
          test -s "oci-runtime/${FILE}"
          echo "${VERSION}" > oci-runtime/oci-runtime-version.txt

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v6
        with:
          name: oci-runtime-${{ matrix.arch }}
          path: ./oci-runtime/*

  helm-chart:
    name: Helm Chart
    if: ${{ inputs.helm_chart_version != 'none' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Get tag
        id: get_tag
        env:
          VERSION: ${{ inputs.helm_chart_version }}
        run: |
          if [ "$VERSION" = "release" ]; then
            tag=$(curl -s https://api.github.com/repos/cedana/cedana-helm-charts/releases/latest | jq -r .tag_name)
            echo "tag=$tag" >> $GITHUB_OUTPUT
          else
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          repository: cedana/cedana-helm-charts
          ref: ${{ steps.get_tag.outputs.tag }}

      - name: Upload helm chart
        uses: actions/upload-artifact@v6
        with:
          name: helm-chart
          path: cedana-helm

  # cedana-slurm's slurm-versions file is the single source of truth for which SLURM
  # versions exist. Read it here so this workflow and test_slurm.yml agree.
  slurm-versions:
    name: Slurm Versions
    if: ${{ inputs.slurm_version != 'none' }}
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout cedana-slurm
        uses: actions/checkout@v5
        with:
          repository: cedana/cedana-slurm
          ref: ${{ inputs.slurm_ref != '' && inputs.slurm_ref || (inputs.slurm_version == 'release' && 'main' || inputs.slurm_version) }}
          token: ${{ secrets.GIT_CI_PAT }}
          sparse-checkout: slurm-versions
          sparse-checkout-cone-mode: false

      - name: Read slurm-versions
        id: read
        run: |
          set -euo pipefail
          # Entries are SchedMD git tags ("slurm-25-11-5-1") and are used verbatim.
          versions=$(sed -E 's/#.*$//; s/^[[:space:]]*//; s/[[:space:]]*$//' slurm-versions | grep -v '^$')
          json=$(jq -Rsc 'split("\n") | map(select(. != ""))' <<<"$versions")
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "Resolved SLURM versions: $json"

  slurm:
    name: Slurm
    if: ${{ inputs.slurm_version != 'none' }}
    needs: slurm-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
        slurm: ${{ fromJSON(needs.slurm-versions.outputs.versions) }}
    steps:
      - name: Checkout cedana-slurm
        uses: actions/checkout@v5
        with:
          repository: cedana/cedana-slurm
          ref: ${{ inputs.slurm_ref != '' && inputs.slurm_ref || (inputs.slurm_version == 'release' && 'main' || inputs.slurm_version) }}
          path: slurm/cedana-slurm
          token: ${{ secrets.GIT_CI_PAT }}
          submodules: recursive

      - name: Mark git dir as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Resolve slurm binaries
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.slurm_version == 'release' && 'latest' || inputs.slurm_version }}
          SLURM_VERSION: ${{ matrix.slurm }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          VERSION=$(echo $VERSION | sed 's/\//-/g')
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac

          mkdir -p slurm/build

          VERSION_REF="${VERSION//\//-}"
          PKG_VERSION="${VERSION_REF}-${SLURM_VERSION}"
          CHECKOUT_SHA="$(git -C slurm/cedana-slurm rev-parse HEAD)"
          ORIGIN_FILE="slurm/slurm-artifact-origin.txt"

          {
            echo "source_mode=s3"
            echo "source_ref=${VERSION_REF}"
            echo "package_version=${PKG_VERSION}"
            echo "checkout_sha=${CHECKOUT_SHA}"
          } > "$ORIGIN_FILE"

          BINARIES=(
            "cedana-slurm"
            "spank_cedana.so"
            "task_cedana.so"
            "cli_filter_cedana.so"
            "job_submit_cedana.so"
          )
          for binary in "${BINARIES[@]}"; do
            # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
              "${CEDANA_URL}/plugins/download/${binary}?version=${PKG_VERSION}&arch=${ARCH}&build=${BUILD}" \
              -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
              --output "slurm/build/${binary}"
            test -f "slurm/build/${binary}"
            test -s "slurm/build/${binary}"
          done
          echo "${VERSION_REF}" > slurm/slurm-version.txt

      - name: Upload slurm artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.slurm }}-${{ matrix.arch }}
          path: ./slurm/*
          # Callers that also run cedana-slurm's build.yml (e.g. cedana-marshal's release suite) already
          # have an artifact with this name: replace it with what was published
          overwrite: true

  csx:
    name: CSX
    if: ${{ inputs.csx_version != 'none' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download CSX
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ inputs.csx_version == 'release' && 'latest' || inputs.csx_version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            alpha)
              # The propagator falls back to the release channel if missing in alpha. "release" is still the latest release.
              BUILD="alpha"
              if [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            release) BUILD="" ;;
            auto)
              BUILD="alpha"
              if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
                BUILD=""
              fi
              ;;
            *) echo "Invalid channel: ${CHANNEL} (expected auto, alpha or release)"; exit 1 ;;
          esac
          mkdir -p csx

          ARCH="${{ matrix.arch }}"
          FILE="csx"

          # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason

          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "csx/${FILE}"

          test -f "csx/${FILE}"
          test -s "csx/${FILE}"
          echo "${VERSION}" > csx/csx-version.txt

      - name: Upload CSX
        uses: actions/upload-artifact@v6
        with:
          name: csx-${{ matrix.arch }}
          path: ./csx/*
