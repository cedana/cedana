name: Nightly

# This workflow runs all the large tests and benchmarks nightly.

on:
  schedule:
    - cron: "0 5 * * *" # Every day at 1:00 AM (EST)
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false

concurrency:
  group: ${{ github.repository }}-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    name: Download
    uses: ./.github/workflows/download.yml
    secrets: inherit
    with:
      cedana_version: ${{ vars.NIGHTLY_CEDANA_VERSION }}
      criu_version: ${{ vars.NIGHTLY_CRIU_VERSION }}
      gpu_version: ${{ vars.NIGHTLY_GPU_VERSION }}
      streamer_version: ${{ vars.NIGHTLY_STREAMER_VERSION }}
      helm_chart_version: ${{ vars.NIGHTLY_HELM_CHART_VERSION }}
      controller_version: ${{ vars.NIGHTLY_CONTROLLER_VERSION }}
      containerd_runtime_version: ${{ vars.NIGHTLY_CONTAINERD_RUNTIME_VERSION }}
      oci_runtime_version: ${{ vars.NIGHTLY_OCI_RUNTIME_VERSION || 'main' }}
      slurm_version: ${{ vars.NIGHTLY_SLURM_VERSION }}
      csx_version: ${{ vars.NIGHTLY_CSX_VERSION }}
      propagator_version: ${{ vars.NIGHTLY_PROPAGATOR_VERSION }}

  # Only the race-detector builds (for test's race): the rest is downloaded
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      race: true

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    needs: [download, build]
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      slurm_versions: ${{ needs.download.outputs.slurm_versions }}
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug }}
      large: true # include large tests
      propagator: true
      cloud_kubernetes: true # doesn't block anyone at night, and the only place Nebius runs (large)
      upgrade: true
      soak: true # each checkpoint/restore many times, for 1-in-N failures
      race: true # the runc and containerd plugin tests against race-detector builds
      runner: 8cpu # use larger runner
      runner_gpu: 16cpu-1gpu # use larger runner
      parallelism: 4
      post_summary_slack: nightly

  bench:
    name: Bench
    uses: ./.github/workflows/bench.yml
    needs: download
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug }}
      runtimes: cedana
      samples: 2
      push_results: true
      results_dataset: cedana_nightly
      comparison_previous: true
      comparison_runtime: true
      post_summary_slack: nightly
      runner: 8cpu-64g-1xRTX6000 # use larger runner (bench will automatically run larger metrics)
